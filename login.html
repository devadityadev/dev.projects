<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body Styling */
    body {
      font-family: Arial, sans-serif;
      background: url('background.jpg') no-repeat center center fixed; /* Your background image */
      background-size: cover; /* Ensure the image covers the entire screen */
      color: #2e7d32; /* Dark green text */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    /* Login Container */
    .login-container {
      background: rgba(255, 255, 255, 0.9); /* Semi-transparent white card */
      border: 2px solid #c8e6c9; /* Soft green border */
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      width: 300px;
      text-align: center;
      margin-bottom: 20px;
    }

    .login-container h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #1b5e20; /* Darker green for header */
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #c8e6c9;
      border-radius: 5px;
      background: #f1f8e9; /* Light green input background */
      color: #1b5e20;
    }

    input:focus {
      outline: none;
      border-color: #66bb6a;
      box-shadow: 0 0 5px rgba(102, 187, 106, 0.5);
    }

    /* Button Styling */
    button {
      width: 100%;
      padding: 10px;
      background: #66bb6a; /* Medium green */
      color: #ffffff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #43a047; /* Darker green on hover */
    }

    /* Image Styling */
    .hidden-image {
      display: none;
      margin-top: 20px;
    }

    .hidden-image img {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Login</h1>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
   <button type="button" onclick="window.location.href = 'https://www.crowdstrike.com/en-us/blog/';">Login</button>


    </form>
  </div>

  <!-- Hidden Image Section -->
  <div class="hidden-image" id="hidden-image">
    <img src="success.jpg" alt="Success Image">
  </div>

  <script>
    // JavaScript to handle form submission and display the image
    const form = document.getElementById('login-form');
    const hiddenImage = document.getElementById('hidden-image');

    form.addEventListener('submit', function(event) {
      event.preventDefault(); // Prevent form from refreshing the page
      hiddenImage.style.display = 'block'; // Show the hidden image
    });
  </script>
</body>
</html>
